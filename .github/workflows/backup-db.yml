name: Backup Postgres

on:
  schedule:
    # Runs daily at 3:00 AM UTC (midnight BRT)
    - cron: '0 3 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Backup Postgres via Docker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DB_NAME: hotel_paraiso
          DB_USER: hotel_paraiso
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Postgres backup is configured but requires SSH access to VPS."
          echo "To enable:"
          echo "1. Add VPS_HOST, VPS_USER, DB_PASSWORD as GitHub Secrets"
          echo "2. Add SSH private key as secret SSH_PRIVATE_KEY"
          echo "3. Uncomment the SSH backup commands below"
          echo ""
          echo "Manual backup command (run on VPS):"
          echo "docker exec hp-postgres pg_dump -U hotel_paraiso hotel_paraiso | gzip > /backups/hp-\$(date +%Y%m%d).sql.gz"
          echo ""
          echo "Backup status: TEMPLATE READY - needs VPS SSH key to automate"
