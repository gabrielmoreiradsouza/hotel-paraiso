name: Deploy CMS

on:
  push:
    branches: [main]
    paths:
      - 'apps/cms/**'
      - 'Dockerfile.cms'
      - '.github/workflows/deploy-cms.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cms
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cms:latest
            ghcr.io/${{ github.repository }}/cms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Easypanel deploy
        run: |
          curl -s -X POST "${{ secrets.EASYPANEL_CMS_DEPLOY_URL }}" || true
